<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>03 图片预览</title>
<style>
  :root {
    --ink: #111827;
    --muted: #6b7280;
    --line: #e5e7eb;
    --brand: #2563eb;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 18px 20px 20px;
    background: #f8fafc;
    color: var(--ink);
    font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }

  .desc {
    margin: 0 0 12px;
    font-size: 12.5px;
    color: var(--muted);
  }

  .desc code {
    padding: 1px 5px;
    border-radius: 5px;
    background: #eef2f7;
    color: #334155;
    font: 11.5px ui-monospace, "Cascadia Code", Consolas, monospace;
  }

  .stage {
    padding: 20px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background-color: #fbfcfe;
    background-image: radial-gradient(#dfe5ee 1px, transparent 1px);
    background-size: 16px 16px;
    overflow: hidden;
  }

  .preview {
    width: 100%;
    max-height: 260px;
    object-fit: contain;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #fff;
    box-shadow: 0 8px 18px -14px rgb(15 23 42 / 35%);
  }

  .meta {
    margin-top: 10px;
    font: 11.5px ui-monospace, "Cascadia Code", Consolas, monospace;
    color: var(--muted);
  }

  .empty {
    padding: 28px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }

  .controls {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }

  button {
    padding: 7px 13px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
    font: inherit;
    font-size: 12.5px;
    line-height: 1;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }

  button:hover { background: #f1f5f9; border-color: #cbd5e1; }
  button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  button.primary { border-color: var(--brand); background: var(--brand); color: #fff; }
  button.primary:hover { background: #1d4ed8; }

  .chip {
    margin-left: auto;
    color: var(--muted);
    font: 11.5px ui-monospace, "Cascadia Code", Consolas, monospace;
  }
</style>
</head>
<body>

<p class="desc">选一张图片，用 <code>URL.createObjectURL()</code> 生成临时链接预览，显示后 <code>revoke</code> 释放。</p>

<div class="stage">
  <div class="empty" id="stage">还没选图片</div>
</div>

<div class="controls">
  <input type="file" id="file" accept="image/*" style="display:none" />
  <button class="primary" id="pick">选择图片</button>
  <span class="chip" id="state"></span>
</div>

<script>
  const input = document.querySelector('#file')
  const chip = document.querySelector('#state')

  let currentUrl = null

  document.querySelector('#pick').addEventListener('click', () => input.showPicker())

  input.addEventListener('change', () => {
    const file = input.files[0]
    if (!file) return

    // 释放上一张的临时链接
    if (currentUrl) {
      URL.revokeObjectURL(currentUrl)
      currentUrl = null
    }

    // 生成临时链接
    const url = URL.createObjectURL(file)
    currentUrl = url

    document.querySelector('#stage').innerHTML = `
      <img class="preview" src="${url}" alt="${file.name}" />
      <div class="meta">${file.name} · ${(file.size / 1024).toFixed(1)} KB</div>
    `

    // 加载完成后释放（如果 img 仍在页面上，url 还会被引用所以其实要等 img 没用了才释放）
    chip.textContent = 'name: ' + file.name
    console.log(file)
  })
</script>

</body>
</html>
