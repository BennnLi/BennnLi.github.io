<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>06 目录浏览</title>
<style>
  :root {
    --ink: #111827;
    --muted: #6b7280;
    --line: #e5e7eb;
    --brand: #2563eb;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 18px 20px 20px;
    background: #f8fafc;
    color: var(--ink);
    font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }

  .desc {
    margin: 0 0 12px;
    font-size: 12.5px;
    color: var(--muted);
  }

  .desc code {
    padding: 1px 5px;
    border-radius: 5px;
    background: #eef2f7;
    color: #334155;
    font: 11.5px ui-monospace, "Cascadia Code", Consolas, monospace;
  }

  .stage {
    padding: 20px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background-color: #fbfcfe;
    background-image: radial-gradient(#dfe5ee 1px, transparent 1px);
    background-size: 16px 16px;
    overflow: hidden;
  }

  .tree {
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    font: 12px/1.7 ui-monospace, "Cascadia Code", Consolas, monospace;
    max-height: 200px;
    overflow-y: auto;
    white-space: pre;
  }

  .tree .dir { color: var(--brand); }
  .tree .file { color: #374151; }
  .tree .size { color: var(--muted); }

  .empty {
    padding: 28px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }

  .controls {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }

  button {
    padding: 7px 13px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
    font: inherit;
    font-size: 12.5px;
    line-height: 1;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }

  button:hover { background: #f1f5f9; border-color: #cbd5e1; }
  button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  button.primary { border-color: var(--brand); background: var(--brand); color: #fff; }
  button.primary:hover { background: #1d4ed8; }

  .chip {
    margin-left: auto;
    color: var(--muted);
    font: 11.5px ui-monospace, "Cascadia Code", Consolas, monospace;
  }
</style>
</head>
<body>

<p class="desc">选一个目录，用 <code>entries()</code> 递归列出里面的所有文件和子目录。</p>

<div class="stage">
  <div class="empty" id="stage">还没选目录</div>
</div>

<div class="controls">
  <button class="primary" id="pick">选择目录</button>
  <span class="chip" id="state"></span>
</div>

<script>
  const chip = document.querySelector('#state')

  async function listDir(dirHandle, depth = 0) {
    let html = ''
    for await (const [name, handle] of dirHandle.entries()) {
      const indent = '&nbsp;&nbsp;'.repeat(depth)
      if (handle.kind === 'file') {
        const file = await handle.getFile()
        html += `<span class="file">${indent}${name}</span><span class="size"> (${(file.size / 1024).toFixed(1)} KB)</span>\n`
      } else {
        html += `<span class="dir">${indent}${name}/</span>\n`
        html += await listDir(handle, depth + 1)
      }
    }
    return html
  }

  document.querySelector('#pick').addEventListener('click', async () => {
    try {
      const dirHandle = await window.showDirectoryPicker()
      const html = await listDir(dirHandle)
      document.querySelector('#stage').innerHTML = `<div class="tree">${html || '(空目录)'}</div>`
      chip.textContent = 'name: ' + dirHandle.name
    } catch {
      // 用户取消或不支持
      chip.textContent = '未选择目录'
    }
  })
</script>

</body>
</html>
