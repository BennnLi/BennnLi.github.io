<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>02 fill 与 finished</title>
<style>
  :root {
    --ink: #111827;
    --muted: #6b7280;
    --line: #e5e7eb;
    --brand: #2563eb;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 18px 20px 20px;
    background: #f8fafc;
    color: var(--ink);
    font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }

  .desc {
    margin: 0 0 12px;
    font-size: 12.5px;
    color: var(--muted);
  }

  .desc code {
    padding: 1px 5px;
    border-radius: 5px;
    background: #eef2f7;
    color: #334155;
    font: 11.5px ui-monospace, "Cascadia Code", Consolas, monospace;
  }

  .stage {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 140px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background-color: #fbfcfe;
    background-image: radial-gradient(#dfe5ee 1px, transparent 1px);
    background-size: 16px 16px;
    overflow: hidden;
  }

  .notice {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 190px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fff;
    box-shadow: 0 8px 18px -14px rgb(15 23 42 / 45%);
    opacity: 0;
    translate: -36px 0;
  }

  .notice-dot {
    flex: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--brand);
  }

  .notice-lines {
    display: grid;
    gap: 5px;
    flex: 1;
  }

  .notice-lines span {
    height: 5px;
    border-radius: 3px;
    background: #e2e8f0;
  }

  .notice-lines span:last-child { width: 62%; }

  .controls {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }

  button {
    padding: 7px 13px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
    font: inherit;
    font-size: 12.5px;
    line-height: 1;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }

  button:hover { background: #f1f5f9; border-color: #cbd5e1; }

  button:focus-visible {
    outline: 2px solid var(--brand);
    outline-offset: 2px;
  }

  button.primary {
    border-color: var(--brand);
    background: var(--brand);
    color: #fff;
  }

  button.primary:hover { background: #1d4ed8; }

  .chip {
    margin-left: auto;
    color: var(--muted);
    font: 11.5px ui-monospace, "Cascadia Code", Consolas, monospace;
  }
</style>
</head>
<body>

<p class="desc"><code>fill: 'forwards'</code> 让动画停在最后一帧；播完时 <code>finished</code> 会 resolve，重置要 <code>cancel()</code>。</p>

<div class="stage">
  <div class="notice" id="notice">
    <span class="notice-dot"></span>
    <span class="notice-lines"><span></span><span></span></span>
  </div>
</div>

<div class="controls">
  <button class="primary" data-act="replay">重播</button>
  <button data-act="reset">重置</button>
  <span class="chip" id="state"></span>
</div>

<script>
  const notice = document.querySelector('#notice')
  const chip = document.querySelector('#state')

  const animation = notice.animate(
    [
      { opacity: 0, translate: '-36px 0' },
      { opacity: 1, translate: '0 0' },
    ],
    { duration: 700, fill: 'forwards', easing: 'ease-out' },
  )

  const watch = () => {
    animation.finished.then(() => {
      chip.textContent = '已结束'
    }).catch(() => {})
  }

  document.querySelector('.controls').addEventListener('click', (event) => {
    const act = event.target.dataset.act
    if (act === 'replay') {
      animation.cancel()
      animation.play()
      watch()
    } else if (act === 'reset') {
      animation.cancel()
    } else {
      return
    }
    chip.textContent = animation.playState
  })

  chip.textContent = animation.playState
  watch()
</script>

</body>
</html>
