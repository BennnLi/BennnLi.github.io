<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>fill 模式对比</title>
<style>
body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; background: #f5f5f7; color: #1f2937; }
.description { background: #e8f0fe; color: #1a56db; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; }
.description code { font-family: ui-monospace, monospace; }
.card { background: #fff; border-radius: 12px; padding: 16px 18px; box-shadow: 0 1px 3px rgb(0 0 0 / 8%); }
.row + .row { margin-top: 14px; }
.row-head { display: flex; align-items: baseline; gap: 10px; font-size: 13px; margin-bottom: 6px; }
code { font-family: ui-monospace, monospace; background: #f1f5f9; padding: 1px 6px; border-radius: 4px; }
.hint { color: #6b7280; font-size: 12px; }
.track { position: relative; height: 44px; border-radius: 8px; background: repeating-linear-gradient(90deg, #f8fafc 0 36px, #eef2f7 36px 72px); overflow: hidden; }
.box { position: absolute; top: 8px; left: 8px; width: 28px; height: 28px; border-radius: 7px; background: #1a73e8; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 6px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; }
button:hover { background: #f3f4f6; }
button.primary { background: #1a73e8; border-color: #1a73e8; color: #fff; }
button.primary:hover { background: #1663c7; }
.state { margin: 10px 0 0; font-size: 12px; color: #6b7280; }
</style>
</head>
<body>

<div class="description">
  三个方块用同一组关键帧，只有 <code>fill</code> 不同：延迟 700ms，播放 800ms
</div>

<div class="card">
  <div class="row">
    <div class="row-head"><code>fill: 'none'</code><span class="hint">延迟时在原位，结束后回到原位</span></div>
    <div class="track"><div class="box" id="box-none"></div></div>
  </div>
  <div class="row">
    <div class="row-head"><code>fill: 'backwards'</code><span class="hint">延迟期间显示第一帧，结束后回到原位</span></div>
    <div class="track"><div class="box" id="box-backwards"></div></div>
  </div>
  <div class="row">
    <div class="row-head"><code>fill: 'forwards'</code><span class="hint">结束后停在最后一帧</span></div>
    <div class="track"><div class="box" id="box-forwards"></div></div>
  </div>
</div>

<div class="controls">
  <button class="primary" id="play">播放</button>
  <button id="reset">重置</button>
  <button id="commit">commitStyles + cancel</button>
</div>

<p class="state" id="state">点播放开始</p>

<script>
const rows = [
  { id: 'none', fill: 'none' },
  { id: 'backwards', fill: 'backwards' },
  { id: 'forwards', fill: 'forwards' },
]

const keyframes = [
  { transform: 'translateX(120px)', opacity: 1 },
  { transform: 'translateX(220px)', opacity: 0.35 },
]
const timing = { duration: 800, delay: 700, easing: 'ease-out' }

let animations = []
const state = document.querySelector('#state')
const boxes = document.querySelectorAll('.box')

function playAll() {
  animations.forEach((animation) => animation.cancel())
  boxes.forEach((box) => box.removeAttribute('style'))
  animations = rows.map((row) =>
    document.querySelector(`#box-${row.id}`).animate(keyframes, { ...timing, fill: row.fill }),
  )
  state.textContent = '播放中：延迟 700ms 后开始'
  Promise.all(animations.map((animation) => animation.finished.catch(() => null))).then(() => {
    state.textContent = '已结束：none 和 backwards 回到原位，forwards 停在终点'
  })
}

function resetAll() {
  animations.forEach((animation) => animation.cancel())
  animations = []
  boxes.forEach((box) => box.removeAttribute('style'))
  state.textContent = '已重置'
}

document.querySelector('#play').addEventListener('click', playAll)
document.querySelector('#reset').addEventListener('click', resetAll)

document.querySelector('#commit').addEventListener('click', () => {
  const forwards = animations[2]
  if (!forwards) {
    state.textContent = '先播放一次再落地'
    return
  }
  if (forwards.playState !== 'finished') {
    state.textContent = '等动画播完再落地'
    return
  }
  if (typeof forwards.commitStyles !== 'function') {
    state.textContent = '当前浏览器不支持 commitStyles'
    return
  }
  forwards.commitStyles()
  forwards.cancel()
  state.textContent = 'forwards 的最终值已写入内联样式，动画已取消'
})
</script>

</body>
</html>
