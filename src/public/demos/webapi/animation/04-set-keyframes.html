<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>04 setKeyframes</title>
<style>
  :root {
    --ink: #111827;
    --muted: #6b7280;
    --line: #e5e7eb;
    --brand: #2563eb;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 18px 20px 20px;
    background: #f8fafc;
    color: var(--ink);
    font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }

  .desc {
    margin: 0 0 12px;
    font-size: 12.5px;
    color: var(--muted);
  }

  .desc code {
    padding: 1px 5px;
    border-radius: 5px;
    background: #eef2f7;
    color: #334155;
    font: 11.5px ui-monospace, "Cascadia Code", Consolas, monospace;
  }

  .stage {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    height: 150px;
    padding-bottom: 20px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background-color: #fbfcfe;
    background-image: radial-gradient(#dfe5ee 1px, transparent 1px);
    background-size: 16px 16px;
    overflow: hidden;
  }

  .box {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    background: var(--brand);
  }

  .controls {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }

  button {
    padding: 7px 13px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
    font: inherit;
    font-size: 12.5px;
    line-height: 1;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }

  button:hover { background: #f1f5f9; border-color: #cbd5e1; }

  button:focus-visible {
    outline: 2px solid var(--brand);
    outline-offset: 2px;
  }

  button.primary {
    border-color: var(--brand);
    background: var(--brand);
    color: #fff;
  }

  button.primary:hover { background: #1d4ed8; }

  .chip {
    margin-left: auto;
    color: var(--muted);
    font: 11.5px ui-monospace, "Cascadia Code", Consolas, monospace;
  }
</style>
</head>
<body>

<p class="desc"><code>effect.setKeyframes()</code> 换一组动作，正在播的动画不重来，直接按新关键帧继续。</p>

<div class="stage">
  <div class="box" id="box"></div>
</div>

<div class="controls">
  <button class="primary" data-act="swap">换个动作</button>
  <span class="chip" id="state"></span>
</div>

<script>
  const box = document.querySelector('#box')
  const chip = document.querySelector('#state')

  const up = [
    { transform: 'translateY(0)' },
    { transform: 'translateY(-60px)' },
  ]

  const side = [
    { transform: 'translateX(-60px) rotate(-30deg)' },
    { transform: 'translateX(60px) rotate(30deg)' },
  ]

  const effect = new KeyframeEffect(box, up, {
    duration: 900,
    iterations: Infinity,
    direction: 'alternate',
    easing: 'ease-in-out',
  })

  const animation = new Animation(effect)
  animation.play()

  let isUp = true
  document.querySelector('.controls').addEventListener('click', (event) => {
    if (event.target.dataset.act !== 'swap') return
    isUp = !isUp
    effect.setKeyframes(isUp ? up : side)
    chip.textContent = isUp ? '上下浮动' : '左右摆动'
  })

  chip.textContent = '上下浮动'
</script>

</body>
</html>
