<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>@property — 有/无对比</title>
<style>
/* ========== 注册过的属性：动画生效 ========== */
@property --registered-color {
  syntax: '<color>';
  inherits: false;
  initial-value: #3498db;
}

body {
  font-family: sans-serif;
  padding: 40px;
  background: #f5f5f5;
}

.row {
  display: flex;
  gap: 40px;
  justify-content: center;
  align-items: flex-start;
}

.col {
  text-align: center;
}

.col .label {
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 12px;
}

.box {
  width: 100px;
  height: 100px;
  border-radius: 8px;
}

/* 未注册的 --plain-color：动画不生效，瞬间跳变 */
.no-property {
  --plain-color: #e74c3c;
  background: var(--plain-color);
  animation: switch-plain 2s linear infinite alternate;
}

/* 注册过的 --registered-color：平滑过渡 */
.with-property {
  background: var(--registered-color);
  animation: switch-registered 2s linear infinite alternate;
}

@keyframes switch-plain {
  0%   { --plain-color: #e74c3c; }
  100% { --plain-color: #3498db; }
}

@keyframes switch-registered {
  0%   { --registered-color: #e74c3c; }
  100% { --registered-color: #3498db; }
}
</style>
</head>
<body>

<div class="row">
  <div class="col">
    <div class="label" style="color:#c0392b;">❌ 无 @property</div>
    <div class="box no-property"></div>
    <p style="font-size:13px;color:#999;margin-top:8px;">没有注册的 <code>--plain-color</code><br>动画不生效，瞬间跳变</p>
  </div>
  <div class="col">
    <div class="label" style="color:#27ae60;">✅ 有 @property</div>
    <div class="box with-property"></div>
    <p style="font-size:13px;color:#999;margin-top:8px;">注册过的 <code>--registered-color</code><br>颜色平滑过渡</p>
  </div>
</div>

</body>
</html>
