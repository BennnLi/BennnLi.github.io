<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>@scope 基础 — 限定作用域</title>
<style>
/* ---------- 卡片区域内的 img ---------- */
@scope (.card) {
  img {
    width: 80px; height: 80px;
    border-radius: 12px;
    object-fit: cover;
  }
  .title {
    font-size: 18px;
    font-weight: bold;
    color: #1677ff;
  }
}

/* ---------- 通用布局 ---------- */
body {
  font-family: sans-serif;
  display: flex; gap: 30px;
  padding: 40px;
  background: #f5f5f5;
}
img { border: 2px solid #ccc; }
.title { color: #999; }
</style>
</head>
<body>

<!-- ✅ .card 作用域内 —— 样式生效 -->
<div class="card">
  <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Crect fill='%231677ff' width='80' height='80'/%3E%3Ctext x='40' y='44' text-anchor='middle' fill='white' font-size='14'%3EA%3C/text%3E%3C/svg%3E" alt="">
  <div class="title">卡片标题（蓝色加粗）</div>
</div>

<!-- ❌ 作用域外 —— 全局样式（灰色、无圆角） -->
<div class="sidebar">
  <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Crect fill='%23999' width='80' height='80'/%3E%3Ctext x='40' y='44' text-anchor='middle' fill='white' font-size='14'%3EB%3C/text%3E%3C/svg%3E" alt="">
  <div class="title">侧栏标题（灰色）</div>
</div>

</body>
</html>
