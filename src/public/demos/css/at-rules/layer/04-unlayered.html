<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>@layer — 未分层样式优先级最高</title>
<style>
@layer base {
  .banner {
    color: blue;
    background: #e6f0ff;
    border: 2px solid blue;
  }
}

/* ⚠️ 不在任何层中 —— 优先级高于所有分层样式 */
.banner {
  color: red;
  background: #ffe6e6;
  border: 2px solid red;
}

body {
  font-family: sans-serif;
  display: flex; gap: 20px;
  justify-content: center; align-items: center;
  min-height: 100vh;
  background: #f5f5f5;
}
.banner {
  padding: 20px 30px;
  border-radius: 8px;
  font-weight: bold; font-size: 18px;
}
</style>
</head>
<body>

<div class="banner">
  红色 —— 未分层样式胜出，即使 base 层中有同选择器的样式
</div>

</body>
</html>
