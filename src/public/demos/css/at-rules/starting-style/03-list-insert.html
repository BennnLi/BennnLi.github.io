<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>@starting-style — 动态插入列表项</title>
<style>
body {
  font-family: sans-serif;
  padding: 40px;
  background: #f5f5f5;
  max-width: 400px;
  margin: 0 auto;
}

/* 列表项最终状态 */
.item {
  background: #fff;
  padding: 14px 20px;
  margin: 8px 0;
  border-radius: 8px;
  border-left: 3px solid #1677ff;
  opacity: 1;
  transform: translateX(0);
  transition: opacity 0.3s, transform 0.3s;
}

/* 新插入项的起始状态 */
@starting-style {
  .item {
    opacity: 0;
    transform: translateX(-20px);
  }
}

button {
  padding: 10px 24px;
  font-size: 16px;
  border: none;
  background: #1677ff;
  color: #fff;
  border-radius: 6px;
  cursor: pointer;
  margin-bottom: 16px;
}
</style>
</head>
<body>

<button onclick="addItem()">添加一项</button>
<div id="list"></div>

<script>
let n = 0
function addItem() {
  n++
  const div = document.createElement('div')
  div.className = 'item'
  div.textContent = '列表项 #' + n
  document.getElementById('list').appendChild(div)
}
// 页面加载时先插入一条看效果
addItem()
</script>

</body>
</html>
