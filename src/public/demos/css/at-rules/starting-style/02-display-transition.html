<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>@starting-style — 解决 display:none 过渡</title>
<style>
body {
  font-family: sans-serif;
  padding: 40px;
  background: #f5f5f5;
}

/* 弹窗最终状态 */
.modal {
  background: #fff;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.15);
  max-width: 300px;
  opacity: 1;
  transform: scale(1);
  transition: opacity 0.3s, transform 0.3s;
}

.modal.hidden {
  display: none;
}

/* 从 hidden→显示 时的起始状态 */
@starting-style {
  .modal:not(.hidden) {
    opacity: 0;
    transform: scale(0.8);
  }
}

button {
  padding: 10px 24px;
  font-size: 16px;
  border: none;
  background: #1677ff;
  color: #fff;
  border-radius: 6px;
  cursor: pointer;
  margin-bottom: 20px;
}
</style>
</head>
<body>

<button onclick="toggle()">切换弹窗</button>

<div class="modal hidden" id="modal">
  <h3>弹窗标题</h3>
  <p>这个弹窗从 scale(0.8) 淡入到 scale(1)</p>
</div>

<script>
function toggle() {
  document.getElementById('modal').classList.toggle('hidden')
}
</script>

</body>
</html>
