<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>:is() 基础 — 简化多选择器</title>
<style>
body {
  font-family: sans-serif;
  padding: 40px;
  background: #f5f5f5;
}

/* ========== 以前的写法：重复 ========== */
/* header h1, header h2, header h3,
nav h1, nav h2, nav h3,
footer h1, footer h2, footer h3 {
  font-family: "PingFang SC", sans-serif;
  color: #333;
} */

/* ========== 现在的写法：:is() ========== */
:is(header, nav, footer) :is(h1, h2, h3) {
  font-family: "PingFang SC", sans-serif;
  color: #1a73e8;
}

:is(a[href], button):hover {
  opacity: 0.8;
  cursor: pointer;
}

/* ========== 实际应用 ========== */
header, nav, footer {
  padding: 20px;
  margin: 10px 0;
  background: white;
  border-radius: 8px;
}

h1 { font-size: 1.5rem; margin: 0 0 8px; }
h2 { font-size: 1.25rem; margin: 0 0 6px; }
h3 { font-size: 1rem; margin: 0; }

a {
  color: #1a73e8;
  text-decoration: none;
  margin-right: 12px;
}

button {
  padding: 6px 12px;
  border: 1px solid #1a73e8;
  background: white;
  color: #1a73e8;
  border-radius: 4px;
  cursor: pointer;
}

.description {
  background: #e8f0fe;
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 20px;
  color: #1a73e8;
}
</style>
</head>
<body>

<div class="description">
  <strong>:is() 基础示例</strong> — 简化多选择器，保持原有特异性
</div>

<header>
  <h1>Header 标题</h1>
  <h2>Header 副标题</h2>
  <h3>Header 小标题</h3>
</header>

<nav>
  <h1>Nav 标题</h1>
  <h2>Nav 副标题</h2>
  <a href="#">链接1</a>
  <a href="#">链接2</a>
  <button>按钮</button>
</nav>

<footer>
  <h1>Footer 标题</h1>
  <h2>Footer 副标题</h2>
  <h3>Footer 小标题</h3>
</footer>

</body>
</html>
