<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>:where() 基础 — 特异性为 0 的默认样式</title>
<style>
body {
  font-family: sans-serif;
  padding: 40px;
  background: #f5f5f5;
}

/* ========== :where() 写默认样式 — 特异性为 0 ========== */
:where(button) {
  padding: 8px 16px;
  border: 1px solid #ccc;
  border-radius: 4px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.2s;
}

:where(a) {
  color: #666;
  text-decoration: none;
}

/* ========== 业务样式 — 普通选择器就能覆盖 ========== */
.btn-primary {
  background: #1a73e8;
  color: white;
  border-color: #1a73e8;
}

.btn-danger {
  background: #dc3545;
  color: white;
  border-color: #dc3545;
}

.link-highlight {
  color: #1a73e8;
  font-weight: bold;
}

/* ========== 演示 ========== */
.container {
  background: white;
  padding: 24px;
  border-radius: 8px;
  margin-bottom: 20px;
}

.description {
  background: #e8f0fe;
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 20px;
  color: #1a73e8;
}

h2 { margin-top: 0; }

.buttons { display: flex; gap: 12px; margin: 16px 0; }
.links { display: flex; gap: 16px; margin: 16px 0; }
</style>
</head>
<body>

<div class="description">
  <strong>:where() 基础示例</strong> — 特异性为 0，写可覆盖的默认样式
</div>

<div class="container">
  <h2>按钮示例</h2>
  <p>默认按钮（:where(button) 样式）：</p>
  <div class="buttons">
    <button>默认按钮</button>
    <button class="btn-primary">主要按钮</button>
    <button class="btn-danger">危险按钮</button>
  </div>
  <p><strong>说明：</strong>.btn-primary 和 .btn-danger 无需 !important 即可覆盖默认样式</p>
</div>

<div class="container">
  <h2>链接示例</h2>
  <p>默认链接（:where(a) 样式）：</p>
  <div class="links">
    <a href="#">默认链接</a>
    <a href="#" class="link-highlight">高亮链接</a>
  </div>
  <p><strong>说明：</strong>.link-highlight 无需 !important 即可覆盖默认样式</p>
</div>

</body>
</html>
