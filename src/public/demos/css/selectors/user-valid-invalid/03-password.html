<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>:user-valid / :user-invalid 密码验证</title>
<style>
body {
  font-family: sans-serif;
  padding: 40px;
  background: #f5f5f5;
}

.container {
  background: white;
  padding: 24px;
  border-radius: 8px;
  margin-bottom: 20px;
}

.description {
  background: #e8f0fe;
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 20px;
  color: #1a73e8;
}

h2 { margin-top: 0; }

/* ========== 密码验证样式 ========== */
input[type="password"]:user-valid {
  border-color: #28a745;
}

input[type="password"]:user-invalid {
  border-color: #dc3545;
}

/* ========== 密码强度提示 ========== */
.hint {
  margin-top: 8px;
  font-size: 14px;
  display: none;
}

input:user-valid + .hint {
  color: #28a745;
  display: block;
}

input:user-invalid + .hint {
  color: #dc3545;
  display: block;
}

/* ========== 密码强度条 ========== */
.strength-bar {
  height: 4px;
  background: #ddd;
  border-radius: 2px;
  margin-top: 8px;
  overflow: hidden;
}

.strength-bar::after {
  content: '';
  display: block;
  height: 100%;
  width: 0;
  background: #dc3545;
  transition: width 0.3s, background 0.3s;
}

input:user-valid ~ .strength-bar::after {
  width: 100%;
  background: #28a745;
}

input:user-invalid ~ .strength-bar::after {
  width: 50%;
  background: #dc3545;
}

/* ========== 演示 ========== */
.form-group {
  margin-bottom: 24px;
}

label {
  display: block;
  margin-bottom: 8px;
  font-weight: bold;
  color: #333;
}

input {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid #ddd;
  border-radius: 8px;
  font-size: 16px;
  transition: all 0.2s;
  box-sizing: border-box;
}

input:focus {
  outline: none;
  border-color: #1a73e8;
}

.code {
  font-family: monospace;
  background: #f0f0f0;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 13px;
}
</style>
</head>
<body>

<div class="description">
  <strong>:user-valid / :user-invalid 密码验证</strong> — 密码强度提示
</div>

<div class="container">
  <h2>密码验证示例</h2>
  <p class="code">input[type="password"]:user-valid { border-color: #28a745; }</p>

  <div class="form-group">
    <label>密码（至少 8 位）</label>
    <input type="password" minlength="8" required placeholder="请输入密码">
    <div class="hint">密码强度足够</div>
    <div class="strength-bar"></div>
  </div>

  <div class="form-group">
    <label>确认密码</label>
    <input type="password" minlength="8" required placeholder="请再次输入密码">
    <div class="hint">密码强度足够</div>
    <div class="strength-bar"></div>
  </div>
</div>

</body>
</html>
