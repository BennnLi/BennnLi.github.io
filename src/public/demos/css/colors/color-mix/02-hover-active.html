<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>color-mix() 交互状态</title>
<style>
body {
  font-family: sans-serif;
  padding: 40px;
  background: #f5f5f5;
}

.container {
  background: white;
  padding: 24px;
  border-radius: 8px;
  margin-bottom: 20px;
}

.description {
  background: #e8f0fe;
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 20px;
  color: #1a73e8;
}

h2 { margin-top: 0; }

/* ========== 用 color-mix() 生成交互状态 ========== */
.button {
  --primary: #1a73e8;
  padding: 12px 24px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  color: white;
  cursor: pointer;
  transition: background 0.2s;
  background: var(--primary);
}

.button:hover {
  /* 混合 20% 黑色 = 加深 */
  background: color-mix(in srgb, var(--primary) 80%, black);
}

.button:active {
  /* 混合 40% 黑色 = 更深 */
  background: color-mix(in srgb, var(--primary) 60%, black);
}

.button:disabled {
  /* 混合 50% 白色 = 变淡 */
  background: color-mix(in srgb, var(--primary) 50%, white);
  color: color-mix(in srgb, var(--primary) 70%, white);
  cursor: not-allowed;
}

/* ========== 不同颜色的按钮 ========== */
.button-green {
  --primary: #28a745;
}

.button-red {
  --primary: #dc3545;
}

/* ========== 演示 ========== */
.buttons {
  display: flex;
  gap: 16px;
  margin: 16px 0;
  flex-wrap: wrap;
}

.code {
  font-family: monospace;
  background: #f0f0f0;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 13px;
}
</style>
</head>
<body>

<div class="description">
  <strong>color-mix() 交互状态</strong> — 用 color-mix() 生成 hover/active/disabled 色
</div>

<div class="container">
  <h2>按钮交互状态</h2>
  <p class="code">hover: color-mix(in srgb, var(--primary) 80%, black)</p>
  <div class="buttons">
    <button class="button">蓝色按钮</button>
    <button class="button button-green">绿色按钮</button>
    <button class="button button-red">红色按钮</button>
    <button class="button" disabled>禁用按钮</button>
  </div>
</div>

</body>
</html>
