<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>color-mix() 动态主题</title>
<style>
body {
  font-family: sans-serif;
  padding: 40px;
  background: #f5f5f5;
}

.container {
  background: white;
  padding: 24px;
  border-radius: 8px;
  margin-bottom: 20px;
}

.description {
  background: #e8f0fe;
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 20px;
  color: #1a73e8;
}

h2 { margin-top: 0; }

/* ========== 用 color-mix() 生成主题色变体 ========== */
:root {
  --primary: #1a73e8;
}

.card {
  --card-bg: color-mix(in srgb, var(--primary) 10%, white);
  --card-border: color-mix(in srgb, var(--primary) 30%, white);
  --card-text: color-mix(in srgb, var(--primary) 80%, black);

  background: var(--card-bg);
  border: 1px solid var(--card-border);
  color: var(--card-text);
  padding: 20px;
  border-radius: 8px;
  margin: 16px 0;
}

.card h3 {
  margin-top: 0;
  color: var(--primary);
}

.card p {
  margin-bottom: 16px;
}

.button {
  --btn-bg: color-mix(in srgb, var(--primary) 90%, white);
  --btn-hover: color-mix(in srgb, var(--primary) 80%, black);
  --btn-active: color-mix(in srgb, var(--primary) 70%, black);

  background: var(--btn-bg);
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  transition: background 0.2s;
}

.button:hover {
  background: var(--btn-hover);
}

.button:active {
  background: var(--btn-active);
}

/* ========== 主题切换 ========== */
.theme-switcher {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
}

.theme-btn {
  padding: 8px 16px;
  border: 2px solid var(--primary);
  background: white;
  color: var(--primary);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  font-weight: bold;
}

.theme-btn:hover {
  background: var(--primary);
  color: white;
}

.theme-btn.active {
  background: var(--primary);
  color: white;
}

/* ========== 不同主题 ========== */
.theme-blue { --primary: #1a73e8; }
.theme-green { --primary: #28a745; }
.theme-red { --primary: #dc3545; }
.theme-purple { --primary: #6f42c1; }

.code {
  font-family: monospace;
  background: #f0f0f0;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 13px;
}
</style>
</head>
<body>

<div class="description">
  <strong>color-mix() 动态主题</strong> — 用 color-mix() 生成主题色变体
</div>

<div class="theme-switcher">
  <button class="theme-btn active" onclick="setTheme('blue')">蓝色主题</button>
  <button class="theme-btn" onclick="setTheme('green')">绿色主题</button>
  <button class="theme-btn" onclick="setTheme('red')">红色主题</button>
  <button class="theme-btn" onclick="setTheme('purple')">紫色主题</button>
</div>

<div class="container">
  <h2>主题色变体</h2>
  <p class="code">--card-bg: color-mix(in srgb, var(--primary) 10%, white);</p>
  <div class="card">
    <h3>卡片标题</h3>
    <p>这个卡片使用了 color-mix() 生成的主题色变体。背景、边框、文字颜色都是基于主色调生成的。</p>
    <button class="button">主要按钮</button>
  </div>
</div>

<script>
function setTheme(theme) {
  const themes = {
    blue: '#1a73e8',
    green: '#28a745',
    red: '#dc3545',
    purple: '#6f42c1'
  };

  document.documentElement.style.setProperty('--primary', themes[theme]);

  // 更新按钮状态
  document.querySelectorAll('.theme-btn').forEach(btn => {
    btn.classList.remove('active');
    if (btn.textContent.includes(theme === 'blue' ? '蓝色' : 
                                   theme === 'green' ? '绿色' : 
                                   theme === 'red' ? '红色' : '紫色')) {
      btn.classList.add('active');
    }
  });
}
</script>

</body>
</html>
