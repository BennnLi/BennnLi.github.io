<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>oklch() 设计系统色板</title>
<style>
body {
  font-family: sans-serif;
  padding: 40px;
  background: #f5f5f5;
}

.container {
  background: white;
  padding: 24px;
  border-radius: 8px;
  margin-bottom: 20px;
}

.description {
  background: #e8f0fe;
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 20px;
  color: #1a73e8;
}

h2 { margin-top: 0; }

/* ========== 用 oklch() 定义设计系统色板 ========== */
:root {
  /* 蓝色色板 — 通过调整亮度生成 */
  --blue-50:  oklch(0.97 0.02 250);
  --blue-100: oklch(0.93 0.04 250);
  --blue-200: oklch(0.87 0.08 250);
  --blue-300: oklch(0.78 0.12 250);
  --blue-400: oklch(0.68 0.16 250);
  --blue-500: oklch(0.58 0.20 250);
  --blue-600: oklch(0.48 0.20 250);
  --blue-700: oklch(0.38 0.18 250);
  --blue-800: oklch(0.28 0.14 250);
  --blue-900: oklch(0.18 0.10 250);

  /* 绿色色板 */
  --green-500: oklch(0.6 0.2 145);
  --green-600: oklch(0.5 0.2 145);

  /* 红色色板 */
  --red-500: oklch(0.6 0.2 25);
  --red-600: oklch(0.5 0.2 25);
}

/* ========== 色板展示 ========== */
.color-palette {
  display: flex;
  gap: 4px;
  margin: 16px 0;
}

.color-swatch {
  flex: 1;
  height: 60px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 4px;
  font-size: 10px;
  color: white;
  text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  border-radius: 4px;
}

/* ========== 组件示例 ========== */
.buttons {
  display: flex;
  gap: 12px;
  margin: 16px 0;
}

.button {
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: bold;
  color: white;
  cursor: pointer;
  transition: background 0.2s;
}

.button-primary {
  background: var(--blue-500);
}

.button-primary:hover {
  background: var(--blue-600);
}

.button-success {
  background: var(--green-500);
}

.button-success:hover {
  background: var(--green-600);
}

.button-danger {
  background: var(--red-500);
}

.button-danger:hover {
  background: var(--red-600);
}

/* ========== 卡片示例 ========== */
.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin: 16px 0;
}

.card {
  padding: 20px;
  border-radius: 8px;
  background: var(--blue-50);
  border: 1px solid var(--blue-200);
}

.card h3 {
  margin-top: 0;
  color: var(--blue-700);
}

.card p {
  margin-bottom: 0;
  color: var(--blue-600);
}

.code {
  font-family: monospace;
  background: #f0f0f0;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 13px;
}
</style>
</head>
<body>

<div class="description">
  <strong>oklch() 设计系统色板</strong> — 用 oklch() 生成一致的色板
</div>

<div class="container">
  <h2>1. 蓝色色板</h2>
  <p class="code">--blue-500: oklch(0.58 0.20 250);</p>
  <div class="color-palette">
    <div class="color-swatch" style="background: var(--blue-50); color: #333;">50</div>
    <div class="color-swatch" style="background: var(--blue-100); color: #333;">100</div>
    <div class="color-swatch" style="background: var(--blue-200); color: #333;">200</div>
    <div class="color-swatch" style="background: var(--blue-300); color: #333;">300</div>
    <div class="color-swatch" style="background: var(--blue-400);">400</div>
    <div class="color-swatch" style="background: var(--blue-500);">500</div>
    <div class="color-swatch" style="background: var(--blue-600);">600</div>
    <div class="color-swatch" style="background: var(--blue-700);">700</div>
    <div class="color-swatch" style="background: var(--blue-800);">800</div>
    <div class="color-swatch" style="background: var(--blue-900);">900</div>
  </div>
</div>

<div class="container">
  <h2>2. 按钮组件</h2>
  <div class="buttons">
    <button class="button button-primary">主要按钮</button>
    <button class="button button-success">成功按钮</button>
    <button class="button button-danger">危险按钮</button>
  </div>
</div>

<div class="container">
  <h2>3. 卡片组件</h2>
  <div class="cards">
    <div class="card">
      <h3>卡片标题</h3>
      <p>使用蓝色色板的浅色作为背景</p>
    </div>
    <div class="card">
      <h3>卡片标题</h3>
      <p>边框使用蓝色色板的中等颜色</p>
    </div>
    <div class="card">
      <h3>卡片标题</h3>
      <p>文字使用蓝色色板的深色</p>
    </div>
  </div>
</div>

</body>
</html>
