<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>light-dark() 基础用法</title>
<style>
:root {
  color-scheme: light dark;
}

body {
  font-family: sans-serif;
  padding: 40px;
  background: light-dark(#f5f5f5, #111);
  color: light-dark(#333, #eee);
}

.container {
  background: light-dark(#ffffff, #1a1a1a);
  padding: 24px;
  border-radius: 8px;
  margin-bottom: 20px;
  border: 1px solid light-dark(#ddd, #333);
}

.description {
  background: light-dark(#e8f0fe, #1a2332);
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 20px;
  color: light-dark(#1a73e8, #8ab4f8);
}

h2 { margin-top: 0; color: light-dark(#333, #eee); }

/* ========== 基础变量 ========== */
:root {
  --bg: light-dark(#ffffff, #111111);
  --text: light-dark(#333333, #eeeeee);
  --text-secondary: light-dark(#666666, #aaaaaa);
  --border: light-dark(#dddddd, #333333);
  --primary: light-dark(#1a73e8, #8ab4f8);
}

/* ========== 组件 ========== */
.card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
  margin: 16px 0;
}

.card h3 {
  color: var(--text);
  margin-top: 0;
}

.card p {
  color: var(--text-secondary);
  margin-bottom: 0;
}

.link {
  color: var(--primary);
  text-decoration: none;
}

.link:hover {
  text-decoration: underline;
}

.code {
  font-family: monospace;
  background: light-dark(#f0f0f0, #2a2a2a);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 13px;
}

.note {
  background: light-dark(#d4edda, #1a2e1a);
  padding: 12px 16px;
  border-radius: 8px;
  margin-top: 16px;
  color: light-dark(#155724, #4caf50);
}
</style>
</head>
<body>

<div class="description">
  <strong>light-dark() 基础</strong> — 根据系统主题自动切换颜色
</div>

<div class="container">
  <h2>1. 基础用法</h2>
  <p class="code">background: light-dark(#ffffff, #111111);</p>
  <p>这个页面会根据你的系统主题自动切换亮色/暗色模式。</p>
  <div class="note">
    <strong>提示：</strong>尝试在系统设置中切换亮色/暗色模式，页面会自动响应。
  </div>
</div>

<div class="container">
  <h2>2. CSS 变量</h2>
  <p class="code">--bg: light-dark(#ffffff, #111111);</p>
  <div class="card">
    <h3>卡片标题</h3>
    <p>这个卡片使用了 CSS 变量定义的主题色，会自动跟随系统主题切换。</p>
  </div>
</div>

<div class="container">
  <h2>3. 链接样式</h2>
  <p class="code">color: light-dark(#1a73e8, #8ab4f8);</p>
  <p>这是一个 <a href="#" class="link">链接示例</a>，颜色会自动适配主题。</p>
</div>

</body>
</html>
