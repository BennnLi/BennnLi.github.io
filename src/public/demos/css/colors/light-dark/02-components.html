<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>light-dark() 组件主题</title>
<style>
:root {
  color-scheme: light dark;
}

body {
  font-family: sans-serif;
  padding: 40px;
  background: light-dark(#f5f5f5, #111);
  color: light-dark(#333, #eee);
}

.container {
  background: light-dark(#ffffff, #1a1a1a);
  padding: 24px;
  border-radius: 8px;
  margin-bottom: 20px;
  border: 1px solid light-dark(#ddd, #333);
}

.description {
  background: light-dark(#e8f0fe, #1a2332);
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 20px;
  color: light-dark(#1a73e8, #8ab4f8);
}

h2 { margin-top: 0; color: light-dark(#333, #eee); }

/* ========== 卡片组件 ========== */
.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin: 16px 0;
}

.card {
  background: light-dark(#ffffff, #1a1a1a);
  border: 1px solid light-dark(#ddd, #333);
  border-radius: 12px;
  padding: 20px;
  box-shadow: light-dark(
    0 2px 8px rgba(0,0,0,0.1),
    0 2px 8px rgba(0,0,0,0.3)
  );
}

.card h3 {
  margin-top: 0;
  color: light-dark(#333, #eee);
}

.card p {
  margin-bottom: 16px;
  color: light-dark(#666, #aaa);
}

/* ========== 按钮组件 ========== */
.button {
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  transition: background 0.2s;
}

.button-primary {
  background: light-dark(#1a73e8, #8ab4f8);
  color: light-dark(#fff, #111);
}

.button-secondary {
  background: light-dark(#f0f0f0, #2a2a2a);
  color: light-dark(#333, #eee);
  border: 1px solid light-dark(#ddd, #444);
}

/* ========== 标签组件 ========== */
.tags {
  display: flex;
  gap: 8px;
  margin: 16px 0;
  flex-wrap: wrap;
}

.tag {
  padding: 4px 12px;
  border-radius: 16px;
  font-size: 12px;
  font-weight: bold;
}

.tag-blue {
  background: light-dark(#e8f0fe, #1a2332);
  color: light-dark(#1a73e8, #8ab4f8);
}

.tag-green {
  background: light-dark(#e8f5e9, #1a2e1a);
  color: light-dark(#2e7d32, #4caf50);
}

.tag-red {
  background: light-dark(#fce4ec, #2e1a1a);
  color: light-dark(#c62828, #ef5350);
}

.code {
  font-family: monospace;
  background: light-dark(#f0f0f0, #2a2a2a);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 13px;
}
</style>
</head>
<body>

<div class="description">
  <strong>light-dark() 组件主题</strong> — 卡片、按钮、标签等组件主题切换
</div>

<div class="container">
  <h2>1. 卡片组件</h2>
  <p class="code">background: light-dark(#ffffff, #1a1a1a);</p>
  <div class="cards">
    <div class="card">
      <h3>卡片 1</h3>
      <p>背景和边框自动适配主题</p>
      <button class="button button-primary">操作</button>
    </div>
    <div class="card">
      <h3>卡片 2</h3>
      <p>阴影也会自动调整</p>
      <button class="button button-secondary">取消</button>
    </div>
    <div class="card">
      <h3>卡片 3</h3>
      <p>文字颜色自动适配</p>
      <button class="button button-primary">确认</button>
    </div>
  </div>
</div>

<div class="container">
  <h2>2. 标签组件</h2>
  <div class="tags">
    <span class="tag tag-blue">CSS</span>
    <span class="tag tag-green">JavaScript</span>
    <span class="tag tag-red">TypeScript</span>
    <span class="tag tag-blue">HTML</span>
    <span class="tag tag-green">Vue</span>
  </div>
</div>

</body>
</html>
