<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>CSS Nesting 基础用法</title>
<style>
body {
  font-family: sans-serif;
  padding: 40px;
  background: #f5f5f5;
}

.container {
  background: white;
  padding: 24px;
  border-radius: 8px;
  margin-bottom: 20px;
}

.description {
  background: #e8f0fe;
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 20px;
  color: #1a73e8;
}

h2 { margin-top: 0; }

/* ========== CSS Nesting 示例 ========== */
.card {
  background: #fff;
  border-radius: 8px;
  padding: 20px;
  border: 1px solid #ddd;
  margin: 16px 0;

  .title {
    font-size: 18px;
    font-weight: bold;
    margin-top: 0;
    color: #333;
  }

  .content {
    color: #666;
    line-height: 1.6;
  }

  .footer {
    border-top: 1px solid #eee;
    padding-top: 12px;
    margin-top: 12px;
    font-size: 14px;
    color: #999;
  }

  &:hover {
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    transition: box-shadow 0.2s;
  }
}

/* ========== 按钮嵌套 ========== */
.button {
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  transition: background 0.2s;

  &-primary {
    background: #1a73e8;
    color: white;

    &:hover {
      background: #1557b0;
    }

    &:active {
      background: #0d47a1;
    }
  }

  &-secondary {
    background: #f0f0f0;
    color: #333;
    border: 1px solid #ddd;

    &:hover {
      background: #e0e0e0;
    }
  }
}

.code {
  font-family: monospace;
  background: #f0f0f0;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 13px;
}
</style>
</head>
<body>

<div class="description">
  <strong>CSS Nesting 基础</strong> — 使用嵌套语法简化 CSS
</div>

<div class="container">
  <h2>1. 组件嵌套</h2>
  <p class="code">.card { .title { ... } .content { ... } &:hover { ... } }</p>
  <div class="card">
    <h3 class="title">卡片标题</h3>
    <p class="content">这是卡片内容，使用 CSS Nesting 定义样式。</p>
    <div class="footer">底部信息</div>
  </div>
</div>

<div class="container">
  <h2>2. 按钮嵌套</h2>
  <p class="code">.button { &-primary { &:hover { ... } } }</p>
  <div style="display: flex; gap: 12px;">
    <button class="button button-primary">主要按钮</button>
    <button class="button button-secondary">次要按钮</button>
  </div>
</div>

</body>
</html>
